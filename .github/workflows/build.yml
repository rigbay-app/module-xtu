name: build

on:
  push:
  pull_request:

# Read-only token, no secrets, nothing is published from this workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out (with the host contract submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Build
        run: dotnet build Rigbay.Xtu.slnx --configuration Release --nologo

      - name: Test
        run: dotnet test Rigbay.Xtu.slnx --configuration Release --no-build --nologo
